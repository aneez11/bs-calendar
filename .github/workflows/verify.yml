name: Verify & Publish BS Calendar

on:
  schedule:
    # Run monthly to catch data drift
    - cron: '0 0 1 * *'
  workflow_dispatch:  # Allow manual trigger
    inputs:
      publish:
        description: 'Publish to npm (manual runs)'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'src/data/bs-data.raw.json'
  release:
    types: [released]  # Publishing a GitHub release ships the package to npm

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run build:data
      - run: npx tsx scripts/verify-data.ts
      - run: npm test

  publish:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # npm provenance (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org/'

      # Safety: a GitHub release must carry the exact version being published
      - name: Check package version matches release tag
        if: github.event_name == 'release'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match release tag ($GITHUB_REF_NAME)"
            exit 1
          fi

      - run: npm ci
      # Full pipeline gate: regenerate data, verify fixtures, build dist, run tests
      - run: npm run ci

      - name: Publish to npm
        if: github.event_name == 'release' || inputs.publish == true
        # The registry already hosts an older bs-calendar line (1.0.228, a
        # retired package under the same account). npm refuses to move the
        # implicit `latest` tag DOWN to a lower version, so publish under an
        # explicit tag first, then point `latest` at this release.
        run: npm publish --tag next --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Point latest dist-tag at the published version
        if: github.event_name == 'release' || inputs.publish == true
        run: npm dist-tag add bs-calendar@$(node -p "require('./package.json').version") latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry-run pack (manual run without publish)
        if: github.event_name != 'release' && inputs.publish != true
        run: npm publish --dry-run --tag next
